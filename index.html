<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Tic Tac Toe</title>
</head>
<body>
        <div cellIndex="0" class="box"><button>1</button></div>
        <div cellIndex="1" class="box"><button>2</button></div>
        <div cellIndex="2" class="box"><button>3</button></div>
        <div cellIndex="3" class="box"><button>4</button></div>
        <div cellIndex="4" class="box"><button>5</button></div>
        <div cellIndex="5" class="box"><button>6</button></div>
        <div cellIndex="6" class="box"><button>7</button></div>
        <div cellIndex="7" class="box"><button>8</button></div>
        <div cellIndex="8" class="box"><button>9</button></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
